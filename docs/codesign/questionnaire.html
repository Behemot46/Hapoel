<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  body {

  /* Header, black band with kit stripes */
  header.hero {

  .progress {

  .card {

  .card.selected { border-color: var(--red); background: var(--red-soft); }
  .card.selected .card-title::before { content: "● "; color: var(--red); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    cursor: pointer;

  .chip:hover { border-color: var(--red); }
  .chip.selected { background: var(--red); border-color: var(--red); color: var(--red-ink); font-weight: 600; }

  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    text-align: start;
    cursor: pointer;

  .rank-item:hover { border-color: var(--red); }
  .rank-badge {

    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);

  .rank-item.ranked { border-color: var(--red); }
  .rank-item.ranked .rank-badge { background: var(--red); border: none; color: var(--red-ink); }
  .rank-reset { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px 0; }

  /* Rating matrix */
  .rate-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .rate-name { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
  .rate-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .rate-seg button {
    font: inherit; font-size: 12.5px;
    padding: 6px 2px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    line-height: 1.3;
  }
  .rate-seg button.selected { background: var(--red); border-color: var(--red); color: var(--red-ink); font-weight: 700; }

  /* Text */
  textarea, input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    resize: vertical;
  }
  textarea { min-height: 80px; }

  :is(.card, .chip, .rank-item, .rate-seg button, .btn, textarea, input):focus-visible {
    outline: 2.5px solid var(--focus);
    outline-offset: 2px;
  }

  /* Nav */
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; }
  .btn {
    font: inherit; font-weight: 700;
    border-radius: 10px;
    padding: 11px 26px;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .btn-primary { background: var(--red); color: var(--red-ink); border-color: var(--red); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: none; color: var(--muted); border-color: var(--line); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* Summary */
  .sum-section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .sum-section h3 { margin: 0 0 10px; font-size: 16px; color: var(--red); }
  .sum-q { margin-bottom: 10px; }

  .sum-q .sa.empty { color: var(--muted); font-style: italic; }
  .export-box { margin-top: 20px; }
  .export-box textarea { min-height: 180px; font-size: 13px; direction: rtl; }
  .copied { color: var(--ok); font-weight: 700; font-size: 14px; margin-inline-start: 10px; }
</style>

        ] },
      { id: "out_of_scope", type: "text",
        label: "מחוץ לתחום",
        hint: "מה במפורש לא ייכנס לגרסה הראשונה?" },
      { id: "anything_else", type: "text",
        label: "עוד משהו?",
        hint: "כל מחשבה, חלום או הסתייגות שלא נכנסו לשאלון." },
    ],
  },
];

const TOTAL = SECTIONS.length;
const app = document.getElementById("app");
const progressWrap = document.getElementById("progressWrap");
let screen = -1; // -1 welcome, 0..TOTAL-1 sections, TOTAL summary
let answers = {};

try {
  const saved = localStorage.getItem("hapoel-questionnaire");
  if (saved) answers = JSON.parse(saved);
} catch (e) {}

function save() {
  try { localStorage.setItem("hapoel-questionnaire", JSON.stringify(answers)); } catch (e) {}
}

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}

function render() {
  app.innerHTML = "";
  window.scrollTo(0, 0);
  if (screen === -1) { progressWrap.hidden = true; renderWelcome(); return; }
  progressWrap.hidden = false;
  if (screen === TOTAL) { renderSummary(); updateProgress("סיכום", TOTAL); return; }
  const sec = SECTIONS[screen];
  updateProgress(sec.title, screen);
  renderSection(sec);
}

function updateProgress(title, idx) {
  document.getElementById("stepTitle").textContent = title;
  document.getElementById("stepNum").textContent =
    idx === TOTAL ? "סיום" : "שלב " + (idx + 1) + " מתוך " + TOTAL;
  document.getElementById("barFill").style.width = Math.round(((idx) / TOTAL) * 100) + "%";
}

function renderWelcome() {
  const s = el("div", "screen");
  s.appendChild(el("h2", "", "לפני שכותבים שורת קוד אחת"));
  const p = el("p", "intro");
  p.textContent = "האפליקציה הזאת תיבנה סביב מה שחשוב לך ולאוהדים, לא סביב מה שנוח לבנות. שמונה שלבים קצרים: חזון, קהל, פיצ׳רים, תוכן, פלטפורמה, קהילה, עיצוב והצלחה. אפשר לדלג על כל שאלה, ואפשר לחזור אחורה. התשובות נשמרות בדפדפן.";
  s.appendChild(p);
  const nav = el("div", "nav");
  nav.appendChild(el("span"));
  const b = el("button", "btn btn-primary", "בואו נתחיל");
  b.onclick = () => { screen = 0; render(); };
  nav.appendChild(b);
  s.appendChild(nav);
  app.appendChild(s);
}

function renderSection(sec) {
  const s = el("div", "screen");
  s.appendChild(el("h2", "", sec.title));
  const intro = el("p", "intro"); intro.textContent = sec.intro; s.appendChild(intro);

  sec.questions.forEach(q => {
    const qw = el("div", "q");
    const lbl = el("div", "q-label"); lbl.textContent = q.label; qw.appendChild(lbl);
    if (q.hint) { const h = el("div", "q-hint"); h.textContent = q.hint; qw.appendChild(h); }
    if (q.type === "single") renderSingle(qw, q);
    else if (q.type === "multi") renderMulti(qw, q);
    else if (q.type === "rank") renderRank(qw, q);
    else if (q.type === "rate") renderRate(qw, q);
    else if (q.type === "text") renderText(qw, q);
    s.appendChild(qw);
  });

  const nav = el("div", "nav");
  const back = el("button", "btn btn-ghost", "חזרה");
  back.onclick = () => { screen--; render(); };
  nav.appendChild(back);
  const next = el("button", "btn btn-primary", screen === TOTAL - 1 ? "לסיכום" : "הבא");
  next.onclick = () => { screen++; render(); };
  nav.appendChild(next);
  s.appendChild(nav);
  app.appendChild(s);
}

function renderSingle(qw, q) {
  const box = el("div", "cards");
  q.options.forEach(opt => {
    const t = typeof opt === "string" ? opt : opt.t;
    const b = el("button", "card");
    b.type = "button";
    let inner = '<span class="card-title"></span>';
    if (opt.d) inner += '<span class="card-desc"></span>';
    b.innerHTML = inner;
    b.querySelector(".card-title").textContent = t;
    if (opt.d) b.querySelector(".card-desc").textContent = opt.d;
    if (answers[q.id] === t) b.classList.add("selected");
    b.onclick = () => {
      answers[q.id] = answers[q.id] === t ? undefined : t;
      save();
      box.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
      if (answers[q.id]) b.classList.add("selected");
    };
    box.appendChild(b);
  });
  qw.appendChild(box);
}

function renderMulti(qw, q) {
  const box = el("div", "chips");
  const cur = () => answers[q.id] || [];
  q.options.forEach(t => {
    const b = el("button", "chip");
    b.type = "button";
    b.textContent = t;
    if (cur().includes(t)) b.classList.add("selected");
    b.onclick = () => {
      const c = cur();
      answers[q.id] = c.includes(t) ? c.filter(x => x !== t) : [...c, t];
      save();
      b.classList.toggle("selected");
    };
    box.appendChild(b);
  });
  qw.appendChild(box);
}

function renderRank(qw, q) {
  const box = el("div", "rank-list");
  const cur = () => answers[q.id] || [];
  const redraw = () => {
    box.querySelectorAll(".rank-item").forEach(item => {
      const t = item.dataset.item;
      const pos = cur().indexOf(t);
      const badge = item.querySelector(".rank-badge");
      if (pos >= 0) { item.classList.add("ranked"); badge.textContent = pos + 1; }
      else { item.classList.remove("ranked"); badge.textContent = "-"; }
    });
  };
  q.items.forEach(t => {
    const b = el("button", "rank-item");
    b.type = "button";
    b.dataset.item = t;
    b.innerHTML = '<span class="rank-badge">-</span><span></span>';
    b.querySelector("span:last-child").textContent = t;
    b.onclick = () => {
      const c = cur();
      answers[q.id] = c.includes(t) ? c.filter(x => x !== t) : [...c, t];
      save();
      redraw();
    };
    box.appendChild(b);
  });
  qw.appendChild(box);
  const reset = el("button", "rank-reset", "איפוס הדירוג");
  reset.type = "button";
  reset.onclick = () => { answers[q.id] = []; save(); redraw(); };
  qw.appendChild(reset);
  redraw();
}

function renderRate(qw, q) {
  const cur = () => answers[q.id] || {};
  q.items.forEach(name => {
    const row = el("div", "rate-row");
    const n = el("div", "rate-name"); n.textContent = name; row.appendChild(n);
    const seg = el("div", "rate-seg");
    RATE_LEVELS.forEach((lvl, i) => {
      const b = el("button");
      b.type = "button";
      b.textContent = lvl;
      if (cur()[name] === i) b.classList.add("selected");
      b.onclick = () => {
        const c = { ...cur() };
        if (c[name] === i) delete c[name]; else c[name] = i;
        answers[q.id] = c;
        save();
        seg.querySelectorAll("button").forEach(x => x.classList.remove("selected"));
        if (answers[q.id][name] === i) b.classList.add("selected");
      };
      seg.appendChild(b);
    });
    row.appendChild(seg);
    qw.appendChild(row);
  });
}

function renderText(qw, q) {
  const t = el("textarea");
  t.value = answers[q.id] || "";
  t.oninput = () => { answers[q.id] = t.value; save(); };
  qw.appendChild(t);
}

function answerText(q) {
  const a = answers[q.id];
  if (a === undefined || a === "" || (Array.isArray(a) && a.length === 0) ||
      (typeof a === "object" && !Array.isArray(a) && Object.keys(a).length === 0)) return null;
  if (q.type === "single" || q.type === "text") return String(a);
  if (q.type === "multi") return a.join("; ");
  if (q.type === "rank") return a.map((t, i) => (i + 1) + ". " + t).join("\n");
  if (q.type === "rate") {
    const order = [...q.items].filter(n => a[n] !== undefined).sort((x, y) => a[y] - a[x]);
    return order.map(n => n + ", " + RATE_LEVELS[a[n]]).join("\n");
  }
  return null;
}

function buildExport() {
  let md = "# שאלון אפליקציית הפועל ירושלים, תשובות\n\n";
  SECTIONS.forEach(sec => {
    md += "## " + sec.title + "\n\n";
    sec.questions.forEach(q => {
      const a = answerText(q);
      md += "**" + q.label + ":**\n" + (a === null ? "(לא נענה)" : a) + "\n\n";
    });
  });
  return md;
}

function renderSummary() {
  const s = el("div", "screen");
  s.appendChild(el("h2", "", "סיכום התשובות"));
  const intro = el("p", "intro");
  intro.textContent = "זה מה שענית. אפשר לחזור אחורה ולתקן, וכשהכול מרגיש נכון, מעתיקים את הבלוק למטה ומדביקים בחזרה בצ׳אט עם קלוד.";
  s.appendChild(intro);

  SECTIONS.forEach(sec => {
    const box = el("div", "sum-section");
    box.appendChild(el("h3", "", sec.title));
    sec.questions.forEach(q => {
      const a = answerText(q);
      const qd = el("div", "sum-q");
      const sq = el("div", "sq"); sq.textContent = q.label; qd.appendChild(sq);
      const sa = el("div", "sa" + (a === null ? " empty" : ""));
      sa.textContent = a === null ? "לא נענה" : a;
      sa.style.whiteSpace = "pre-line";
      qd.appendChild(sa);
      box.appendChild(qd);
    });
    s.appendChild(box);
  });

  const exp = el("div", "export-box");
  exp.appendChild(el("div", "q-label", "התשובות להעתקה"));
  const ta = el("textarea");
  ta.readOnly = true;
  ta.value = buildExport();
  exp.appendChild(ta);
  const row = el("div", "nav");
  const back = el("button", "btn btn-ghost", "חזרה לעריכה");
  back.onclick = () => { screen = TOTAL - 1; render(); };
  row.appendChild(back);
  const wrapBtns = el("div");
  const copy = el("button", "btn btn-primary", "העתקת התשובות");
  const okMsg = el("span", "copied", "הועתק ✓");
  okMsg.hidden = true;
  copy.onclick = async () => {
    let done = false;
    try { await navigator.clipboard.writeText(ta.value); done = true; } catch (e) {}
    if (!done) {
      ta.focus(); ta.select();
      try { done = document.execCommand("copy"); } catch (e) {}
    }
    if (done) { okMsg.hidden = false; setTimeout(() => { okMsg.hidden = true; }, 2500); }
    else { ta.focus(); ta.select(); }
  };
  wrapBtns.appendChild(copy);
  wrapBtns.appendChild(okMsg);
  row.appendChild(wrapBtns);
  exp.appendChild(row);
  s.appendChild(exp);
  app.appendChild(s);
}

render();
</script>
