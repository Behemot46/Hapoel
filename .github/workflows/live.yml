name: משחק חי

# Runs often, but only during the hours games are actually played, and the
# script itself exits in a second when nothing is on. The result is written
# straight to the published branch rather than to main, so a game night does
# not fill the history with commits and the score reaches fans in ~30s
# instead of going the long way round through the deploy workflow.

on:
  schedule:
    # ערב: כל 5 דקות, 15:00-22:00 UTC, כלומר 17:00-00:00 בחורף
    # ו־18:00-01:00 בקיץ. זה מכסה את משחקי אירופה ואת משחקי הערב בליגה.
    - cron: '*/5 15-22 * * *'
    # אחר הצהריים: כל 10 דקות, 09:00-14:00 UTC. החלון הזה נוסף ב־29.8.2026
    # אחרי שהתברר שהוא חסר לגמרי: משחק הגביע מול מכבי אשדוד ב־8.9 מתחיל
    # ב־17:00 שעון ישראל, כלומר 14:00 UTC, והמשחק מול ב״ש ב־18.9 מתחיל
    # ב־14:30 שעון ישראל, כלומר 11:30 UTC. שניהם היו נגמרים לפני שהפולר
    # בכלל מתעורר, ושני משחקי הגביע הראשונים של העונה היו נשארים בלי
    # תוצאה חיה. עשר דקות ולא חמש, כדי לא להכפיל את מספר הריצות ביום.
    - cron: '*/10 9-14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-score
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Poll the game
        run: python scripts/update_live.py

      # The score has to reach both hosts. Vercel serves main, GitHub Pages
      # serves gh-pages, and a file written to only one of them is a live
      # score that silently never appears on the other.
      - name: Publish live.json
        run: |
          set -euo pipefail
          if [ ! -f app/data/live.json ]; then
            echo "nothing to publish"
            exit 0
          fi
          cp app/data/live.json /tmp/live.json
          git config user.name "hapoel-data-bot"
          git config user.email "actions@users.noreply.github.com"

          # main, this is what Vercel publishes at the custom domain
          git add app/data/live.json
          if git diff --cached --quiet; then
            echo "main: score unchanged since last poll"
          else
            git commit -m "עדכון תוצאה חיה"
            # the data collector may have pushed while we were polling
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "main: published"
                break
              fi
              echo "main: push race, retry $i"
              sleep $((i * 5))
            done
          fi

          # gh-pages, the published branch, so the score reaches fans there
          # in ~30s instead of waiting on a full redeploy
          if ! git fetch origin gh-pages --depth=1; then
            echo "no gh-pages branch yet, nothing to publish to"
            exit 0
          fi
          git checkout -B gh-pages origin/gh-pages
          mkdir -p data
          cp /tmp/live.json data/live.json
          git add data/live.json
          if git diff --cached --quiet; then
            echo "gh-pages: score unchanged since last poll"
          else
            git commit -m "עדכון תוצאה חיה"
            git push origin gh-pages
          fi
