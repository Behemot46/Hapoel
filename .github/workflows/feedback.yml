name: דוח משוב מאוהדים (ידני)

# Reads every answer the form collected and prints one report. Reads only —
# it never writes, comments or closes anything.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the answers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/feedback_report.py
