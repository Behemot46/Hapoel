name: עדכון נתונים אוטומטי

# ריצה אחת מכסה חצי יום.
#
# **למה זה בנוי ככה, ולא כמו שהיה:** עד 2.9.2026 כל סלוט מתוזמן אסף פעם
# אחת ויצא, בהנחה שהסלוטים ייורו. הם לא. המדידה, על הריפו הזה: בין 30.8
# ל־2.9 נורו 5 סלוטים מתוך 12 מבוקשים, כלומר כשליש, והפער הגדול ביותר
# בין שני איסופים היה 18 שעות.
#
# ואז התברר שגם רשת הביטחון לא עובדת: השומר ב־watchdog.yml נבנה על ההנחה
# ששני תזמונים נפרדים ייפלו באופן בלתי תלוי, ולכן שניהם לא ייפלו יחד.
# בפועל, בכל חמש הריצות שלו הוא נורה 8 עד 10 דקות **אחרי** איסוף מוצלח,
# מצא נתונים טריים ולא עשה כלום, ובפערים האמיתיים הוא לא נורה בכלל.
# גיטהאב יורה את שני התזמונים מאותו רגע עיבוד תור.
#
# המסקנה היא לא ״לבקש עוד סלוטים״ אלא להפסיק להיות תלויים בהם, בדיוק כמו
# שנעשה בפולר של התוצאה החיה: הריצה מחזיקה את עצמה ודוגמת בלולאה במשך
# כחמש שעות וחצי, כך שמספיק **סלוט אחד שנורה** כדי לכסות חצי יום. שני
# סלוטים שנורים ברצף לא מתבזבזים: ה־concurrency מעמיד את השני בתור, והוא
# מתחיל בדיוק כשהראשון מסיים.
#
# **ודרך ארץ מול המקורות:** לוח המשחקים, הטבלה והסגל משתנים אולי פעם
# ביום, ואין סיבה לשלוח בשבילם בקשה לאתר הליגה ולאתר המועדון כל עשרים
# דקות. לכן הלולאה עושה מעבר קל של חדשות ופודקאסטים כל 20 דקות, ומעבר
# מלא כל שעתיים, כלומר בדיוק בקצב שהיה קודם. מה שהאוהד מרוויח הוא מדור
# חדשות שמתעדכן בתוך עשרים דקות במקום פעמיים ביום.

on:
  schedule:
    # שבעה סלוטים, כל שעתיים מ־03:23 עד 15:23 UTC. גם אם רק אחד מהם ייורה,
    # הוא מכסה חמש שעות וחצי. הדקה 23 היא לא קפריזה: גיטהאב ממליצה במפורש
    # לא לתזמן על תחילת שעה עגולה, שהיא שיא העומס.
    - cron: '23 3-15/2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'כמה דקות להישאר בלולאה (ברירת מחדל 330)'
        required: false
        default: '330'

permissions:
  contents: write
  actions: write

# ריצה שנייה שתתחיל באמצע הלולאה תמצא את הראשונה עובדת ותמתין בתור. זה
# לא בזבוז אלא בדיוק ההפך: כשהראשונה מסיימת, השנייה מתחילה, והכיסוי
# ממשיך בלי סלוט נוסף.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # תקרה קשיחה מתחת לגבול של גיטהאב (שש שעות למשימה), כדי שריצה תקועה
    # לא תחזיק את התור לנצח
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Collect in a loop until the shift is over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "hapoel-data-bot"
          git config user.email "actions@users.noreply.github.com"

          MINUTES="${{ inputs.minutes || '330' }}"
          DEADLINE=$(( $(date +%s) + MINUTES * 60 ))
          EVERY=$(( 20 * 60 ))      # מעבר קל: חדשות ופודקאסטים
          FULL_EVERY=$(( 2 * 3600 )) # מעבר מלא: גם ליגה, מועדון וסגל
          # דופק: גם כשאין שום שינוי, נדחוף פעם בשעתיים כדי שגיל הקובץ
          # באתר ימשיך להיות אמיתי, וכדי שהשומר יוכל למדוד שהריצה חיה
          HEARTBEAT=$(( 2 * 3600 ))

          last_full=0
          last_push=0

          push_if_changed() {
            # app/img גם הוא: תמונות השחקנים יורדות לריפו כדי שהאפליקציה
            # תעבוד בלי רשת, וקומיט של app/data בלבד היה זורק אותן בשקט
            # בזמן ש־roster.json כבר מצביע עליהן.
            git add app/data/ app/img/
            if git diff --cached --quiet; then
              return 1
            fi
            # שינוי היחיד הוא חותמת הזמן ב־meta.json: זה לא עדכון, זה
            # דופק. דוחפים אותו רק אם עברו שעתיים מהדחיפה האחרונה, אחרת
            # הלולאה תייצר קומיט כל עשרים דקות בלי שום תוכן.
            local changed
            changed=$(git diff --cached --name-only | grep -v '^app/data/meta.json$' || true)
            local now
            now=$(date +%s)
            if [ -z "$changed" ] && [ $(( now - last_push )) -lt "$HEARTBEAT" ]; then
              git reset -q
              echo "  אין שינוי בתוכן, ועוד לא הגיע הזמן לדופק."
              return 1
            fi

            git commit -q -m "עדכון נתונים אוטומטי"
            for i in 1 2 3; do
              # --strategy-option=theirs: בתוך rebase ״theirs״ הוא הקומיט
              # שמוחל, כלומר האיסוף הטרי שלנו. קובצי הנתונים נכתבים מחדש
              # במלואם בכל ריצה, אז כשהם מתנגשים האיסוף החדש הוא התשובה
              # הנכונה. קבצים שהריצה הזאת לא נגעה בהם נשארים כפי שהם
              # ב־origin, כי rebase נוגע רק במה שיש בקומיט שלנו.
              if git pull --rebase --strategy-option=theirs --autostash -q \
                   origin "$GITHUB_REF_NAME" \
                 && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
                last_push=$(date +%s)
                echo "  נדחף."
                # דחיפה של בוט לא מפעילה את הפרסום מעצמה
                gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY" \
                  && echo "  פרסום זומן." || echo "  זימון הפרסום נכשל."
                return 0
              fi
              # בלי abort העץ נשאר תקוע בקונפליקט, וכל ניסיון נוסף מת מיד
              # על ״Pulling is not possible because you have unmerged files״
              git rebase --abort 2>/dev/null || true
              sleep $(( i * 5 ))
            done
            echo "  שלוש דחיפות נכשלו, ממשיכים ללולאה הבאה." >&2
            return 1
          }

          start_poller_if_game_is_close() {
            local near
            near=$(python - <<'PY'
          import datetime, json, pathlib
          SOON = datetime.timedelta(hours=2, minutes=30)
          # גם משחק שכבר התחיל: אם הריצה היחידה שנורתה היא באמצע המשחק,
          # עדיין כדאי להתחיל לדגום. חלון המשחק של הפולר נסגר שלוש שעות
          # אחרי הקפיצה.
          STARTED = datetime.timedelta(hours=2)
          now = datetime.datetime.now(datetime.timezone.utc)
          games = json.loads(pathlib.Path("app/data/games.json").read_text(
              encoding="utf-8")).get("games") or []
          for g in games:
              if g.get("status") == "finished" or g.get("timeTbd"):
                  continue
              try:
                  start = datetime.datetime.fromisoformat(g["date"])
              except Exception:
                  continue
              if now - STARTED <= start <= now + SOON:
                  print(f"{g['id']} {g['date']}")
                  break
          PY
          )
            [ -n "$near" ] || return 0
            # הבדיקה הזאת רצה כל עשרים דקות, ולכן חלון של שעתיים וחצי לפני
            # משחק היה מזמן את הפולר שבע פעמים. ה־concurrency שלו אמנם
            # מונע ריצות מקבילות, אבל אין טעם למלא את התור בריצות שכל מה
            # שהן יעשו הוא להתחיל אחרי שהמשחק נגמר ולצאת מיד.
            local live
            live=$(gh run list --workflow live.yml --repo "$GITHUB_REPOSITORY" \
                     --status in_progress --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo 0)
            if [ "$live" != "0" ]; then
              echo "  משחק מתקרב ($near), והפולר כבר עובד."
              return 0
            fi
            echo "  משחק מתקרב ($near), מפעיל את הפולר."
            gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY" || true
          }

          echo "מתחילים משמרת של ${MINUTES} דקות."
          while :; do
            now=$(date +%s)
            if [ $(( now - last_full )) -ge "$FULL_EVERY" ]; then
              echo "[$(date -u +%H:%M)] מעבר מלא"
              python scripts/update_data.py || true
              last_full=$now
            else
              echo "[$(date -u +%H:%M)] מעבר קל"
              python scripts/update_data.py --only news,podcasts || true
            fi

            push_if_changed || true
            start_poller_if_game_is_close

            now=$(date +%s)
            left=$(( DEADLINE - now ))
            if [ "$left" -le "$EVERY" ]; then
              echo "המשמרת נגמרה."
              break
            fi
            sleep "$EVERY"
          done
