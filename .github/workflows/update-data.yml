name: עדכון נתונים אוטומטי

on:
  schedule:
    # five times a day: ~06:00, ~08:00, ~11:00, ~14:00, ~16:00 Israel time.
    # Deliberately outside the live-score window (15:00-22:00 UTC), a deploy
    # rebuilds gh-pages from scratch and would drop live.json mid-game.
    # The morning and midday runs were added for the news feed: a fixture
    # changes twice a season, a headline changes twice a morning.
    - cron: '0 3,5,8,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Update data files
        run: python scripts/update_data.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "hapoel-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # app/img too, headshots are downloaded into the repo so the app
          # works offline, and committing only app/data/ silently threw them
          # away while roster.json still pointed at them
          git add app/data/ app/img/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "עדכון נתונים אוטומטי"
            # main has more than one writer: סיכום המשוב דוחף ב־05:00 UTC,
            # בדיוק כשהאיסוף הזה רץ, ואז git push נדחה והעדכון נזרק לפח.
            # rebase ונסה שוב, במקום להפיל ריצה שכבר אספה נתונים תקינים.
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                 && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep $((i * 5))
            done
            echo "לא הצלחתי לדחוף את העדכון אחרי שלושה ניסיונות." >&2
            exit 1
          fi

      # bot pushes don't trigger the deploy workflow on their own,
      # so dispatch it explicitly whenever data changed
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
