name: עדכון נתונים אוטומטי

# ריצה אחת מכסה חצי יום.
#
# **למה זה בנוי ככה, ולא כמו שהיה:** עד 2.9.2026 כל סלוט מתוזמן אסף פעם
# אחת ויצא, בהנחה שהסלוטים ייורו. הם לא. המדידה, על הריפו הזה: בין 30.8
# ל־2.9 נורו 5 סלוטים מתוך 12 מבוקשים, כלומר כשליש, והפער הגדול ביותר
# בין שני איסופים היה 18 שעות.
#
# ואז התברר שגם רשת הביטחון לא עובדת: השומר ב־watchdog.yml נבנה על ההנחה
# ששני תזמונים נפרדים ייפלו באופן בלתי תלוי, ולכן שניהם לא ייפלו יחד.
# בפועל, בכל חמש הריצות שלו הוא נורה 8 עד 10 דקות **אחרי** איסוף מוצלח,
# מצא נתונים טריים ולא עשה כלום, ובפערים האמיתיים הוא לא נורה בכלל.
# גיטהאב יורה את שני התזמונים מאותו רגע עיבוד תור.
#
# המסקנה היא לא ״לבקש עוד סלוטים״ אלא להפסיק להיות תלויים בהם, בדיוק כמו
# שנעשה בפולר של התוצאה החיה: הריצה מחזיקה את עצמה ודוגמת בלולאה במשך
# כחמש שעות וחצי, כך שמספיק **סלוט אחד שנורה** כדי לכסות חצי יום. שני
# סלוטים שנורים ברצף לא מתבזבזים: ה־concurrency מעמיד את השני בתור, והוא
# מתחיל בדיוק כשהראשון מסיים.
#
# **ולמה הקצב מפוזר:** כל דחיפה ל־main היא דיפלוי בוורסל, ושם יש תקרה
# של 100 ביום. הפירוט נמצא ליד QUIET_EVERY למטה.
#
# **שימו לב לשלושת הקצבים בלולאה, וזה הלב של הקובץ:**
#
# 1. ביום רגוע האיסוף רץ פעמיים ביום. לוח המשחקים, הטבלה והסגל משתנים
#    אולי פעם ביום, ואין סיבה לבקש אותם מאתר הליגה ומאתר המועדון יותר.
# 2. סביב משחק הוא חוזר לכל שלוש שעות, כדי שהתוצאה תגיע ללוח בתוך שעות.
# 3. הבדיקה אם משחק מתקרב רצה כל עשר דקות, תמיד. זו לא אי־עקביות אלא
#    בדיוק העניין: האיסוף עולה דיפלוי, והבדיקה לא עולה כלום.
#
# **והמדידה שמחזיקה את (1):** ״פעמיים ביום״ נמדד מול הזמן שכתוב
# ב־meta.json שכבר נדחף, ולא מתחילת המשמרת. משמרת חדשה שהייתה אוספת מיד
# הייתה הופכת שבעה סלוטים ביום לשבעה איסופים.

on:
  schedule:
    # שבעה סלוטים, כל שעתיים מ־03:23 עד 15:23 UTC. גם אם רק אחד מהם ייורה,
    # הוא מכסה חמש שעות וחצי. הדקה 23 היא לא קפריזה: גיטהאב ממליצה במפורש
    # לא לתזמן על תחילת שעה עגולה, שהיא שיא העומס.
    - cron: '23 3-15/2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'כמה דקות להישאר בלולאה (ברירת מחדל 330)'
        required: false
        default: '330'

permissions:
  contents: write
  actions: write

# ריצה שנייה שתתחיל באמצע הלולאה תמצא את הראשונה עובדת ותמתין בתור. זה
# לא בזבוז אלא בדיוק ההפך: כשהראשונה מסיימת, השנייה מתחילה, והכיסוי
# ממשיך בלי סלוט נוסף.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # תקרה קשיחה מתחת לגבול של גיטהאב (שש שעות למשימה), כדי שריצה תקועה
    # לא תחזיק את התור לנצח
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Collect in a loop until the shift is over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "hapoel-data-bot"
          git config user.email "actions@users.noreply.github.com"

          MINUTES="${{ inputs.minutes || '330' }}"
          DEADLINE=$(( $(date +%s) + MINUTES * 60 ))
          # **למה פעמיים ביום, וזה לא קפריזה:** כל דחיפה ל־main היא
          # דיפלוי בוורסל, ובתוכנית החינמית יש תקרה של 100 דיפלויים ביום.
          # ב־4.9.2026 נמדדו 148 דחיפות ביממה, 95 מהפולר של התוצאה החיה
          # ו־51 מכאן, וורסל עצרה את הפרסום ל־24 שעות עם ״Deployment rate
          # limited״. כלומר האתר קפא בגרסה ישנה בדיוק בגלל ניסיון לרענן
          # אותו יותר. ב־8.9 נמדדו 89 דחיפות ביממה, מהן 21 מכאן.
          # פעמיים ביום נותנות 2 דיפלויים מהאיסוף, וזה משאיר כמעט את כל
          # התקרה לפולר. מי שמקצר את זה, שיספור קודם.
          #
          # **ולמה אחת עשרה ולא שתים עשרה:** שתים עשרה שעות מתיישרות
          # בדיוק עם אורך היממה, וכל היסט קטן בשעת ההתחלה מפיל יום שלם
          # לאיסוף אחד. אחת עשרה מבטיחות שניים.
          QUIET_EVERY=$(( 11 * 3600 ))
          # **סביב משחק זה לא ״יום רגוע״.** התוצאה צריכה להגיע ללוח בתוך
          # שעות ולא בתוך חצי יום, ולכן בחלון של שלוש שעות לפני הקפיצה עד
          # שש שעות אחריה האיסוף חוזר לקצב צפוף. זה עולה כשלושה דיפלויים
          # ביום משחק, ויום משחק ממילא רחוק מהתקרה.
          GAME_EVERY=$(( 3 * 3600 ))
          # דופק: גם כשאין שום שינוי, נדחוף פעם באחת עשרה שעות כדי שגיל
          # הקובץ באתר ימשיך להיות אמיתי, וכדי שהשומר יוכל למדוד שהריצה
          # חיה. השומר ב־watchdog.yml מודד מול המספר הזה, ולכן שינוי כאן
          # מחייב שינוי שם. scripts/cadence_test.py בודק שהשניים לא נפרדו.
          HEARTBEAT=$(( 11 * 3600 ))
          # **הבדיקה אם משחק מתקרב היא לא איסוף, והיא לא עולה דיפלוי:**
          # היא קוראת games.json מהדיסק ושואלת את גיטהאב אם הפולר כבר
          # עובד. לכן היא נשארת צפופה גם כשהאיסוף מתפזר. אם היא הייתה
          # מתפזרת יחד איתו, שעת הקפיצה הייתה נופלת בין שתי בדיקות והפולר
          # היה מתחיל באמצע המשחק. זה בדיוק הכשל שנמדד ב־8.9, אז בחלון של
          # הפולר עצמו: 20 דקות שנדגמו פעם בשעה, וגם 13:43 וגם 14:43 נפלו
          # מחוץ להן.
          POKE_EVERY=$(( 10 * 60 ))

          last_push=0
          # **מאיפה יודעים מתי נאסף לאחרונה, כשהמשמרת רק התחילה:** מהקובץ
          # שכבר נדחף. בלי השורה הזאת כל משמרת חדשה הייתה אוספת מיד, וכיוון
          # שהתזמון מבקש שבעה סלוטים ביום, ״פעמיים ביום״ היה מתגלגל בשקט
          # לשבע פעמים. הבדיקה ב־cadence_test.py מוודאת שהשורה הזאת קיימת.
          # **הרצה ידנית תמיד אוספת.** הזריעה למטה חוסמת איסוף כשהנתונים
          # טריים, וזה נכון לסלוט מתוזמן. אבל מי שלוחץ Run workflow ביקש
          # איסוף במפורש, ואם הוא מקבל משמרת שרק דוקרת ולא אוספת, הכלי
          # היחיד לתקן נתון עכשיו הוא להמתין. נמדד ב־11.9.2026: אחרי
          # שנוסף שדה השידור לא הייתה שום דרך להביא אותו לאתר במשך 2.6
          # שעות.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "הרצה ידנית, אוספים מיד."
            last_collect=0
          else
          last_collect=$(python - <<'PY'
          import datetime, json, pathlib
          try:
              m = json.loads(pathlib.Path("app/data/meta.json").read_text(encoding="utf-8"))
              print(int(datetime.datetime.fromisoformat(m["lastUpdated"]).timestamp()))
          except Exception:
              print(0)
          PY
          )
          echo "האיסוף האחרון היה לפני $(( ( $(date +%s) - last_collect ) / 60 )) דקות."
          fi

          push_if_changed() {
            # app/img גם הוא: תמונות השחקנים יורדות לריפו כדי שהאפליקציה
            # תעבוד בלי רשת, וקומיט של app/data בלבד היה זורק אותן בשקט
            # בזמן ש־roster.json כבר מצביע עליהן.
            git add app/data/ app/img/
            if git diff --cached --quiet; then
              return 1
            fi
            # שינוי היחיד הוא חותמת הזמן ב־meta.json: זה לא עדכון, זה
            # דופק. דוחפים אותו רק אם עבר HEARTBEAT מהדחיפה האחרונה, אחרת
            # הלולאה תייצר קומיט בכל מעבר בלי שום תוכן.
            local changed
            changed=$(git diff --cached --name-only | grep -v '^app/data/meta.json$' || true)
            local now
            now=$(date +%s)
            if [ -z "$changed" ] && [ $(( now - last_push )) -lt "$HEARTBEAT" ]; then
              git reset -q
              echo "  אין שינוי בתוכן, ועוד לא הגיע הזמן לדופק."
              return 1
            fi

            git commit -q -m "עדכון נתונים אוטומטי"
            for i in 1 2 3; do
              # --strategy-option=theirs: בתוך rebase ״theirs״ הוא הקומיט
              # שמוחל, כלומר האיסוף הטרי שלנו. קובצי הנתונים נכתבים מחדש
              # במלואם בכל ריצה, אז כשהם מתנגשים האיסוף החדש הוא התשובה
              # הנכונה. קבצים שהריצה הזאת לא נגעה בהם נשארים כפי שהם
              # ב־origin, כי rebase נוגע רק במה שיש בקומיט שלנו.
              if git pull --rebase --strategy-option=theirs --autostash -q \
                   origin "$GITHUB_REF_NAME" \
                 && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
                last_push=$(date +%s)
                echo "  נדחף."
                # דחיפה של בוט לא מפעילה את הפרסום מעצמה
                gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY" \
                  && echo "  פרסום זומן." || echo "  זימון הפרסום נכשל."
                return 0
              fi
              # בלי abort העץ נשאר תקוע בקונפליקט, וכל ניסיון נוסף מת מיד
              # על ״Pulling is not possible because you have unmerged files״
              git rebase --abort 2>/dev/null || true
              sleep $(( i * 5 ))
            done
            echo "  שלוש דחיפות נכשלו, ממשיכים ללולאה הבאה." >&2
            return 1
          }

          start_poller_if_game_is_close() {
            local near
            near=$(python - <<'PY'
          import datetime, json, pathlib
          SOON = datetime.timedelta(hours=2, minutes=30)
          # גם משחק שכבר התחיל: אם הריצה היחידה שנורתה היא באמצע המשחק,
          # עדיין כדאי להתחיל לדגום. חלון המשחק של הפולר נסגר שלוש שעות
          # אחרי הקפיצה.
          STARTED = datetime.timedelta(hours=2)
          now = datetime.datetime.now(datetime.timezone.utc)
          games = json.loads(pathlib.Path("app/data/games.json").read_text(
              encoding="utf-8")).get("games") or []
          for g in games:
              if g.get("status") == "finished" or g.get("timeTbd"):
                  continue
              try:
                  start = datetime.datetime.fromisoformat(g["date"])
              except Exception:
                  continue
              if now - STARTED <= start <= now + SOON:
                  print(f"{g['id']} {g['date']}")
                  break
          PY
          )
            # **הדקירה משאירה סימן גם כשאין מה לעשות, וזה בכוונה.** כל
            # משפחת הבאגים כאן היא דברים שלא קרו בשקט: סלוט שלא נורה,
            # חלון שלא נדגם, כותרת שנחסמה. ריצת בדיקה ב־9.9.2026 סיימה
            # בהצלחה ולא היה בלוג שום סימן שהבדיקה רצה שלוש פעמים, כי
            # ״אין משחק״ לא הדפיס כלום. שלושים שורות במשמרת הן מחיר סביר
            # על היכולת לספור אותן.
            if [ -z "$near" ]; then
              echo "  [$(date -u +%H:%M)] אין משחק קרוב."
              return 0
            fi
            # הבדיקה הזאת רצה כל עשר דקות, ולכן חלון של שעתיים וחצי לפני
            # משחק היה מזמן את הפולר חמש־עשרה פעמים. ה־concurrency שלו אמנם
            # מונע ריצות מקבילות, אבל אין טעם למלא את התור בריצות שכל מה
            # שהן יעשו הוא להתחיל אחרי שהמשחק נגמר ולצאת מיד.
            local live
            live=$(gh run list --workflow live.yml --repo "$GITHUB_REPOSITORY" \
                     --status in_progress --limit 1 --json databaseId --jq 'length' 2>/dev/null || echo 0)
            if [ "$live" != "0" ]; then
              echo "  משחק מתקרב ($near), והפולר כבר עובד."
              return 0
            fi
            echo "  משחק מתקרב ($near), מפעיל את הפולר."
            gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY" || true
          }

          # ״יום רגוע״ או ״סביב משחק״. לא מדלגים כאן על משחק שכבר הסתיים,
          # כי דווקא אז יש מה לאסוף: התוצאה.
          collect_every() {
            python - <<'PY'
          import datetime, json, pathlib
          BEFORE = datetime.timedelta(hours=3)
          AFTER = datetime.timedelta(hours=6)
          now = datetime.datetime.now(datetime.timezone.utc)
          games = json.loads(pathlib.Path("app/data/games.json").read_text(
              encoding="utf-8")).get("games") or []
          for g in games:
              if g.get("timeTbd"):
                  continue
              try:
                  start = datetime.datetime.fromisoformat(g["date"])
              except Exception:
                  continue
              if now - AFTER <= start <= now + BEFORE:
                  print("game")
                  break
          else:
              print("quiet")
          PY
          }

          echo "מתחילים משמרת של ${MINUTES} דקות."
          while :; do
            now=$(date +%s)
            if [ "$(collect_every)" = "game" ]; then
              every=$GAME_EVERY
            else
              every=$QUIET_EVERY
            fi
            if [ $(( now - last_collect )) -ge "$every" ]; then
              echo "[$(date -u +%H:%M)] איסוף (מרווח $(( every / 3600 )) שעות)"
              python scripts/update_data.py || true
              last_collect=$now
              push_if_changed || true
            fi

            start_poller_if_game_is_close

            now=$(date +%s)
            left=$(( DEADLINE - now ))
            if [ "$left" -le "$POKE_EVERY" ]; then
              echo "המשמרת נגמרה."
              break
            fi
            sleep "$POKE_EVERY"
          done
