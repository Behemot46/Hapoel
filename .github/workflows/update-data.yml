name: עדכון נתונים אוטומטי

on:
  schedule:
    # כל שעתיים, 03:23 עד 13:23 UTC, כלומר 06:23 עד 16:23 שעון ישראל.
    #
    # **הדקה 23 היא לא קפריזה.** גיטהאב מתעדת שריצות מתוזמנות נדחות
    # ונופלות בשעות עומס, ושתחילת כל שעה עגולה היא שיא העומס, ולכן ממליצה
    # במפורש לתזמן בדקה אחרת. עד 29.8.2026 התזמון היה על הדקה 0, ובשלושה
    # ימים נורו 6 סלוטים מתוך 15. הנתונים היו ישנים ב־16.5 שעות ב־27.8
    # וב־15.4 שעות ב־29.8.
    #
    # לוח קבוע של כל שעתיים ולא חמישה סלוטים מפוזרים, כדי ש״כמה זמן סביר
    # שיעברו בלי עדכון״ תהיה שאלה עם תשובה אחת. השומר ב־watchdog.yml
    # נשען על זה.
    #
    # הערב נשאר פנוי בכוונה: חלון התוצאה החיה הוא 15:00-22:00 UTC, ואין
    # סיבה להוסיף שם רעש של בנייה מחדש של האתר בזמן משחק.
    - cron: '23 3-13/2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# השומר עלול לזמן ריצה בזמן שריצה מתוזמנת כבר רצה. שתי ריצות במקביל
# נלחמות על אותו push, וה־rebase למטה אמנם יטפל בזה, אבל עדיף פשוט לא
# להגיע לשם.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow

      - name: Update data files
        run: python scripts/update_data.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "hapoel-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # app/img too, headshots are downloaded into the repo so the app
          # works offline, and committing only app/data/ silently threw them
          # away while roster.json still pointed at them
          git add app/data/ app/img/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "עדכון נתונים אוטומטי"
            # main has more than one writer: סיכום המשוב דוחף ב־05:00 UTC,
            # בדיוק כשהאיסוף הזה רץ, ואז git push נדחה והעדכון נזרק לפח.
            # rebase ונסה שוב, במקום להפיל ריצה שכבר אספה נתונים תקינים.
            for i in 1 2 3; do
              # --strategy-option=theirs: בתוך rebase ״theirs״ הוא הקומיט
              # שמוחל, כלומר האיסוף הטרי שלנו. קובצי הנתונים נכתבים מחדש
              # במלואם בכל ריצה, אז כשהם מתנגשים האיסוף החדש הוא התשובה
              # הנכונה. קבצים שהריצה הזאת לא נגעה בהם נשארים כפי שהם
              # ב־origin, כי rebase נוגע רק במה שיש בקומיט שלנו.
              if git pull --rebase --strategy-option=theirs --autostash \
                   origin "$GITHUB_REF_NAME" \
                 && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # בלי abort העץ נשאר תקוע בקונפליקט, וכל ניסיון נוסף מת מיד
              # על ״Pulling is not possible because you have unmerged files״.
              # ככה בדיוק נכשלו שלושת הניסיונות ב־18.8.
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "לא הצלחתי לדחוף את העדכון אחרי שלושה ניסיונות." >&2
            exit 1
          fi

      # הפולר של התוצאה החיה לא יכול לסמוך על התזמון שלו: ב־31.8.2026 הוא
      # לא רץ אפילו פעם אחת ביום המשחק הראשון. האיסוף הזה רץ כמה פעמים
      # ביום, ויש לו שומר משלו, ולכן הוא דרך התחלה שנייה ובלתי תלויה.
      # ריצה אחת של הפולר מכסה משחק שלם, ואם הוא כבר רץ, ה־concurrency
      # שלו ידאג שהשנייה תמתין ותצא מיד.
      - name: Start the live poller when a game is close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          near=$(python - <<'PY'
          import datetime, json, pathlib
          SOON = datetime.timedelta(hours=2, minutes=30)
          # גם משחק שכבר התחיל: אם כל הסלוטים לפני המשחק הופלו והריצה
          # היחידה שנורתה היא באמצע המשחק, עדיין כדאי להתחיל לדגום.
          # חלון המשחק של הפולר נסגר שלוש שעות אחרי הקפיצה.
          STARTED = datetime.timedelta(hours=2)
          now = datetime.datetime.now(datetime.timezone.utc)
          games = json.loads(pathlib.Path("app/data/games.json").read_text(
              encoding="utf-8")).get("games") or []
          for g in games:
              if g.get("status") == "finished" or g.get("timeTbd"):
                  continue
              try:
                  start = datetime.datetime.fromisoformat(g["date"])
              except Exception:
                  continue
              if now - STARTED <= start <= now + SOON:
                  print(f"{g['id']} {g['date']}")
                  break
          PY
          )
          if [ -n "$near" ]; then
            echo "משחק מתקרב ($near), מפעיל את הפולר."
            gh workflow run live.yml --ref main -R "$GITHUB_REPOSITORY"
          else
            echo "אין משחק בשעתיים וחצי הקרובות."
          fi

      # bot pushes don't trigger the deploy workflow on their own,
      # so dispatch it explicitly whenever data changed
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
