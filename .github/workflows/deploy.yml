name: פרסום האתר

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      # the live score is pushed straight to gh-pages as well, so a score
      # update must not drag a full site rebuild behind it every 5 minutes
      - '!app/data/live.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # a single self-contained copy fans can download and pass around
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the standalone file
        run: python scripts/build_standalone.py app/hapoel-standalone.html

      # Publishing to a gh-pages branch auto-enables GitHub Pages for the
      # repo, the Pages-via-Actions flow can't create the site with the
      # default workflow token ("Resource not accessible by integration").
      - name: Publish app/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true
