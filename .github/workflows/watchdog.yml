name: שומר רעננות

# רשת ביטחון לאיסוף, ובגרסה הזאת היא סוף סוף שואלת את השאלה הנכונה.
#
# **מה שהיה כאן קודם ולמה הוא לא עבד:** השומר קרא את הגיל של meta.json
# ותו לא, מתוך הנחה ששני תזמונים נפרדים ייפלו באופן בלתי תלוי. המדידה
# ב־2.9.2026 הראתה שההנחה שגויה: בכל חמש הריצות שלו הוא נורה 8 עד 10
# דקות **אחרי** איסוף מוצלח, מצא נתונים טריים ולא עשה כלום, ובפערים
# האמיתיים (18 שעות בין 1.9 ל־2.9) הוא לא נורה בכלל. גיטהאב יורה את שני
# התזמונים מאותו רגע עיבוד תור, ולכן הם נופלים יחד.
#
# מאז האיסוף עצמו נבנה כריצה שמחזיקה את עצמה (update-data.yml), וזה משנה
# את התפקיד כאן: השאלה כבר אינה ״מתי עודכן הקובץ״ אלא **״האם יש בכלל
# ריצת איסוף חיה״**. ריצה חיה שקטה כשאין חדשות, ולכן גיל של שעתיים הוא
# מצב תקין לגמרי כל עוד מישהו עובד. מה שמצדיק זימון הוא רק השילוב: אין
# ריצה חיה, וגם הנתונים ישנים.
#
# כשהכול תקין הוא לא עושה כלום ולא כותב כלום.

on:
  schedule:
    # אחרי כל סלוט של איסוף, ובדקה לא עגולה מאותה סיבה בדיוק
    - cron: '53 3-15/2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'לזמן איסוף גם אם הכול תקין, כדי לבדוק שהשומר באמת מזמן'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: מה מצב האיסוף
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ריצה חיה = queued או in_progress. אם יש כזאת, אין מה לזמן:
          # היא ממילא תדגום שוב בעוד עשרים דקות.
          alive=$(gh run list --workflow update-data.yml --repo "$GITHUB_REPOSITORY" \
                    --status in_progress --limit 1 --json databaseId --jq 'length')
          queued=$(gh run list --workflow update-data.yml --repo "$GITHUB_REPOSITORY" \
                    --status queued --limit 1 --json databaseId --jq 'length')
          alive=$(( alive + queued ))
          echo "alive=$alive" >> "$GITHUB_OUTPUT"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import json
          import pathlib

          # הלולאה דוחפת דופק כל שעתיים גם כשאין חדשות, ולכן שעתיים וחצי
          # הן עדיין תקין ורק מעבר לזה מעיד על ריצה שאיננה.
          LIMIT_HOURS = 2.5

          p = pathlib.Path("app/data/meta.json")
          now = datetime.datetime.now(datetime.timezone.utc)
          try:
              meta = json.loads(p.read_text(encoding="utf-8"))
              last = datetime.datetime.fromisoformat(meta["lastUpdated"])
              hours = (now - last).total_seconds() / 3600
              print(f"hours={hours:.2f}")
              print(f"stale={'yes' if hours > LIMIT_HOURS else 'no'}")
              print(f"last={meta['lastUpdated']}")
          except Exception as e:
              # קובץ חסר או שבור הוא לא סיבה לשתוק, הוא סיבה לאסוף
              print("hours=-1")
              print("stale=yes")
              print(f"last=unreadable: {e}")
          PY

      - name: מה נמצא
        run: |
          echo "ריצות איסוף חיות: ${{ steps.state.outputs.alive }}"
          echo "עודכן לאחרונה: ${{ steps.state.outputs.last }}"
          echo "גיל בשעות: ${{ steps.state.outputs.hours }}"
          echo "ישן מדי: ${{ steps.state.outputs.stale }}"

      - name: לזמן איסוף כשאין אף ריצה חיה והנתונים ישנים
        # שומר שאיש לא ראה אותו מזמן איסוף הוא שומר שאיש לא יודע אם הוא
        # עובד. force מריץ את הענף הזה גם כשהכול תקין.
        if: >-
          (steps.state.outputs.alive == '0' && steps.state.outputs.stale == 'yes')
          || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.state.outputs.alive }}" != "0" ]; then
            echo "יש ריצת איסוף חיה, ובכל זאת מזמן כי התבקשה בדיקה."
          elif [ "${{ steps.state.outputs.stale }}" = "yes" ]; then
            echo "אין ריצה חיה והנתונים ישנים ב־${{ steps.state.outputs.hours }} שעות, מזמן איסוף."
          else
            echo "הכול תקין, מזמן איסוף כי התבקשה בדיקה."
          fi
          gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY"
