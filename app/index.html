<script>
  // a single-file copy opened from disk has no service worker scope
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    // updateViaCache:none — always revalidate the worker itself, so a new
    // version reaches fans instead of being served from the HTTP cache
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      // only when replacing an older worker, so a first visit doesn't reload
      if (hadController && !reloading) { reloading = true; location.reload(); }
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then(function (reg) { if (reg) reg.update(); })
        .catch(function () { /* no worker is fine — the app works online regardless */ });
    });
  }
</script>
